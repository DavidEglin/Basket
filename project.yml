# XcodeGen spec. On the Mac: `xcodegen generate`, then open Basket.xcodeproj.
# Info.plist and the entitlements file under Supporting/ are generated from this file.
name: Basket

options:
  bundleIdPrefix: au.com.yaxley
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  BasketCore:
    path: Packages/BasketCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Basket:
    type: application
    platform: macOS
    sources:
      - path: Basket
    dependencies:
      - package: BasketCore
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Basket
        LSApplicationCategoryType: public.app-category.productivity
        NSCameraUsageDescription: Basket needs the camera for video calls in your messaging apps.
        NSMicrophoneUsageDescription: Basket needs the microphone for calls in your messaging apps.
    entitlements:
      path: Supporting/Basket.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.yaxley.Basket
        PRODUCT_NAME: Basket
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        # "Sign to Run Locally". Set a development team in Xcode if you prefer.
        CODE_SIGN_IDENTITY: "-"
